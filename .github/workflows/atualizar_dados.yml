name: Atualização Automática de Dados - De Olho no Gráfico

on:
  schedule:
    # Executa automaticamente todos os dias às 22:00h (Horário de Brasília)
    # 01:00 UTC corresponde às 22:00h do dia seguinte
    - cron: '0 1 * * *'
  workflow_dispatch: # Permite que você clique no botão no GitHub para rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar o Repositório
      uses: actions/checkout@v3

    - name: Configurar o Python no Servidor
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências de Automação
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Executar Script de Captura e Processamento
      run: |
        python bot_grafico.py

    - name: Salvar e Subir Alterações no jogos.json
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        git add jogos.json
        git diff-index --quiet HEAD || git commit -m "🤖 Motor Gráfico: Dados atualizados via automação"
        git push
